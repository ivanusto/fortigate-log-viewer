name: check
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm test   # east of UTC: the default date range must be the local date
        env: {TZ: Asia/Taipei}
      - run: npm run build
